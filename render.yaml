services:
  - type: web
    name: porra-mundial-2026
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: porra-data
      mountPath: /var/data
      sizeGB: 1
